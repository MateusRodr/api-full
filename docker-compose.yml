version: "3.8"

services:
  api:
    build: .
    container_name: api
    ports:
      - "3013:3012"
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    command: npm start

  test:
    build: .
    container_name: api_test
    depends_on:
      - api
    volumes:
      - ./prisma/test.db:/app/prisma/dev.db
    command: npm test
